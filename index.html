<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Night Rally</title>
    <link rel="stylesheet" href="src/styles.css" />
    <script src="src/main.js?v=20260531-turn-sustain-2" defer></script>
  </head>
  <body>
    <main class="game-shell">
      <canvas id="game" aria-label="Night Rally driving prototype"></canvas>
      <div class="track-switch" aria-label="Track selection">
        <button class="track-button is-active" type="button" data-track="straight">Straight</button>
        <button class="track-button" type="button" data-track="circuit">Circuit</button>
      </div>
      <section class="hud" aria-live="polite">
        <div class="metric">
          <span>Speed (km/h)</span>
          <strong id="speed">0</strong>
        </div>
        <div class="metric">
          <span>G Force (G)</span>
          <strong id="accel">0.00</strong>
        </div>
        <div class="metric">
          <span>Distance (m)</span>
          <strong id="distance">0.0</strong>
        </div>
        <div class="metric metric-time">
          <span>Time (s)</span>
          <strong id="time">0.00</strong>
        </div>
        <div class="metric">
          <span>Steer</span>
          <strong id="steer">0%</strong>
        </div>
        <div class="metric">
          <span>Slip (deg)</span>
          <strong id="slip">0</strong>
        </div>
        <div class="metric">
          <span>Drift</span>
          <strong id="drift">0%</strong>
        </div>
        <div class="metric">
          <span>Yaw (deg/s)</span>
          <strong id="yaw">0</strong>
        </div>
        <div class="metric">
          <span>Radius (m)</span>
          <strong id="radius">--</strong>
        </div>
      </section>
    </main>
  </body>
</html>
